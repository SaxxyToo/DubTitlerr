name: Feature request
description: Propose a behaviour change or a new surface.
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        This is an operator's tool, not a consumer app: a feature that saves a review decision or
        protects the library will land faster than one that adds a dashboard.

  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do that the current behaviour makes hard or impossible?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed behaviour
      description: What should happen instead? Describe the outcome, not the implementation.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds you tried, or another design you rejected and why.
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Context
      description: Release, deployment shape, library size, or anything else that changes the trade-off.
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
