name: Dependency review
# Blocks a pull request that adds a dependency with a known high-severity advisory. osv-scan in
# ci.yml checks the lockfile that exists today; this checks the DELTA a PR introduces, which is
# the only moment a bad version can be stopped before it lands on main.
on:
  pull_request:

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
