name: release
# Tag-triggered: pushing a vX.Y.Z tag validates the tag, re-runs the full CI gate, publishes the
# images this fork deploys, and attaches generated release notes. ghcr.io/<owner>/<repo>:vX.Y.Z
# plus :latest is the builder image omarchy runs; :vX.Y.Z-lite plus :latest-lite is the lite image
# minisax runs. The hosts pull from GHCR instead of building: one built artifact, the same bytes
# everywhere, labelled with the release. `:latest` follows the tag, never `main` -- main is the
# working branch and every commit landing there is not a release.
on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false # never cancel a half-pushed image

permissions:
  contents: read
  packages: write

jobs:
  # A tag is a promise: it names a release, and it must point at a commit that is actually on
  # main. Before this job, a typo'd or off-main tag still published :latest images.
  validate-tag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Require a semver tag on a main commit
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          if ! printf '%s\n' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$'; then
            echo "::error::tag '$tag' is not a semver tag such as v0.4.18"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::tag '$tag' points at $GITHUB_SHA, which is not on main"
            exit 1
          fi
          echo "tag $tag is valid and reachable from main"

  ci-gate:
    uses: ./.github/workflows/ci.yml

  builder:
    needs: [validate-tag, ci-gate]
    runs-on: ubuntu-latest
    # The build downloads a CUDA base plus a whisper model. 40 minutes is generous; it is
    # here so a stalled pull cannot hold a runner for GitHub's six-hour default.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # A hosted runner starts with roughly 14 GB free. The base image (mccloud/subgen, a
      # CUDA/faster-whisper stack) plus the large-v3-turbo weights baked in by Dockerfile.builder
      # can exceed that, and the failure mode is an opaque "no space left on device" deep in a
      # layer. Reclaiming the preinstalled toolchains costs about a minute and buys ~25 GB.
      # If this still runs out, the answer is a self-hosted runner, not a bigger cleanup.
      - name: Reclaim runner disk
        run: |
          set -euo pipefail
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          sudo docker image prune -af
          df -h / | tail -1

      # No third-party action for this. `docker login` over stdin is three lines of shell and
      # avoids adding a supply-chain surface that would itself need pinning and reviewing.
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push
        run: |
          set -euo pipefail
          # github.repository is Owner/Name; GHCR requires the path lowercased.
          repo=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          sha=$(git rev-parse --short HEAD)
          # The version and revision labels come from the tag and the checkout, so the published
          # image answers `docker inspect` without a rebuild: same values the source constant and
          # the boot banner carry.
          docker build -f Dockerfile.builder \
            --build-arg DUBTITLERR_VERSION="$version" \
            --build-arg VCS_REF="$sha" \
            -t "ghcr.io/$repo:$tag" \
            -t "ghcr.io/$repo:latest" \
            .
          docker push "ghcr.io/$repo:$tag"
          docker push "ghcr.io/$repo:latest"
          echo "published ghcr.io/$repo:$tag and :latest"

  lite:
    needs: [validate-tag, ci-gate]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push
        run: |
          set -euo pipefail
          repo=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          sha=$(git rev-parse --short HEAD)
          docker build -f Dockerfile.lite \
            --build-arg DUBTITLERR_VERSION="$version" \
            --build-arg VCS_REF="$sha" \
            -t "ghcr.io/$repo:$tag-lite" \
            -t "ghcr.io/$repo:latest-lite" \
            .
          docker push "ghcr.io/$repo:$tag-lite"
          docker push "ghcr.io/$repo:latest-lite"
          echo "published ghcr.io/$repo:$tag-lite and :latest-lite"

  # The release page is part of what a tag publishes. An existing release keeps its notes:
  # a re-run of the workflow must not overwrite a hand-edited page.
  release:
    needs: [validate-tag, builder, lite]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release $tag already exists; keeping its notes"
          else
            gh release create "$tag" --verify-tag --generate-notes --title "$tag"
            echo "created release $tag"
          fi
