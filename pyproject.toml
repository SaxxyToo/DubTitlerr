[project]
name = "dubtitlerr"
description = "Dubtitles for anime: subtitles that say what the English dub actually says."
readme = "README.md"
license = { file = "LICENSE" }
# The version is NOT repeated here: it is read from dubtitlerr/__init__.py's __version__, the one
# place it is written (that file stays import-free, so setuptools can read the literal without
# importing the package). tests/test_version.py fails if this resolution or the lockfile drifts.
dynamic = ["version"]
requires-python = ">=3.11"
dependencies = ["pysubs2>=1.7", "faster-whisper>=1.2", "jellyfish>=1.0"]
[project.scripts]
dubtitlerr = "dubtitlerr.__main__:main"

[project.urls]
Homepage = "https://github.com/SaxxyToo/DubTitlerr"
Repository = "https://github.com/SaxxyToo/DubTitlerr"
Issues = "https://github.com/SaxxyToo/DubTitlerr/issues"

[project.optional-dependencies]
dev = ["pytest", "ruff"]
# analysis: tools/ scripts only (timing_compare.py's --vad webrtcvad backend), never
# imported by the live pipeline. Split out because webrtcvad is a C-extension with no
# prebuilt wheel for this repo's py3.14 dev venv (see tools/vad.py's module docstring) --
# `pip install -e .[dev]` must keep working without it. `--vad ffmpeg-silencedetect` is
# the dep-free fallback when this extra isn't installed.
analysis = ["webrtcvad>=2.0"]

# The pipeline is an importable package: dubtitlerr/{core,pipeline,glossary,review,settings}/.
# Name it explicitly so setuptools never auto-discovers glossaries/, tests/, tools/ or
# data/ as spurious top-level packages; `pip install -e ".[dev]"` (used purely to pull
# in the runtime + dev dependencies) must keep working.
[tool.setuptools.dynamic]
# Read the literal from dubtitlerr/__init__.py (AST, not import): the package docstring forbids
# imports there, and setuptools only needs the assignment.
version = { attr = "dubtitlerr.__version__" }

[tool.setuptools.packages.find]
include = ["dubtitlerr*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["real_accounts: exercises the real review_auth account functions (first-run, 401 vs 409); every other suite gets accounts stubbed as installed by conftest.py"]

[tool.ruff]
line-length = 130
# Deliberately py39 while the runtime floor is 3.11: raising it turns on 71 pyupgrade
# suggestions across the tree (zip(strict=), etc.) that need behaviour review. Raise it in a
# dedicated PR, not a metadata edit.
target-version = "py39"
# Design docs hand-align the comments in their illustrative Python blocks; ruff
# formats code inside Markdown fences by default and collapses that alignment.
# The real .py files are still formatted -- only prose documents are exempt.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
# The existing scripts use a deliberate terse one-liner house style
# (`if x: return`, `a; b`). Keep the real-bug rules; don't fight the style.
ignore = ["E701", "E702"]
