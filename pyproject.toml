[project]
name = "dubtitlerr"
description = "Dubtitles for anime: subtitles that say what the English dub actually says."
readme = "README.md"
license = { file = "LICENSE" }
# The version is NOT repeated here: it is read from dubtitlerr/__init__.py's __version__, the one
# place it is written (that file stays import-free, so setuptools can read the literal without
# importing the package). tests/test_version.py fails if this resolution or the lockfile drifts.
dynamic = ["version"]
requires-python = ">=3.11"
# Local ASR (faster-whisper -> CTranslate2) is deliberately NOT a base dependency: the
# pipeline imports it lazily (ASR_BACKEND=local only) and the endpoint-only lite image, CI
# and most contributors never need the multi-hundred-MB native stack. Install it with the
# `local` extra: pip install -e ".[dev,local]".
dependencies = ["pysubs2>=1.7", "jellyfish>=1.0"]
[project.scripts]
dubtitlerr = "dubtitlerr.__main__:main"

[project.urls]
Homepage = "https://github.com/SaxxyToo/DubTitlerr"
Repository = "https://github.com/SaxxyToo/DubTitlerr"
Issues = "https://github.com/SaxxyToo/DubTitlerr/issues"

[project.optional-dependencies]
dev = ["pytest", "ruff"]
# faster-whisper for ASR_BACKEND=local (in-process transcription). The lite image and a
# contributor's first `pip install -e ".[dev]"` skip it; a machine that runs the local
# backend installs `.[local]` (or the builder image, which ships it already).
local = ["faster-whisper>=1.2"]
# analysis: tools/ scripts only (timing_compare.py's --vad webrtcvad backend), never
# imported by the live pipeline. Split out because webrtcvad is a C-extension with no
# prebuilt wheel for this repo's py3.14 dev venv (see tools/vad.py's module docstring) --
# `pip install -e .[dev]` must keep working without it. `--vad ffmpeg-silencedetect` is
# the dep-free fallback when this extra isn't installed.
analysis = ["webrtcvad>=2.0"]

# The pipeline is an importable package: dubtitlerr/{core,pipeline,glossary,review,settings}/.
# Name it explicitly so setuptools never auto-discovers glossaries/, tests/, tools/ or
# data/ as spurious top-level packages; `pip install -e ".[dev]"` (used purely to pull
# in the runtime + dev dependencies) must keep working.
[tool.setuptools.dynamic]
# Read the literal from dubtitlerr/__init__.py (AST, not import): the package docstring forbids
# imports there, and setuptools only needs the assignment.
version = { attr = "dubtitlerr.__version__" }

[tool.setuptools.packages.find]
include = ["dubtitlerr*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["real_accounts: exercises the real review_auth account functions (first-run, 401 vs 409); every other suite gets accounts stubbed as installed by conftest.py"]

# Branch coverage, not line coverage: the failure this project fears is a decision path that no
# test ever takes (a park class, a gate refusal, a fallback arm), and line coverage cannot see it.
# CI's 3.13 leg runs this report; it is evidence, not a merge gate yet.
[tool.coverage.run]
branch = true
source = ["dubtitlerr"]

[tool.coverage.report]
show_missing = true
skip_covered = true
precision = 1


[tool.ruff]
line-length = 130
# Deliberately py39 while the runtime floor is 3.11: raising it turns on 71 pyupgrade
# suggestions across the tree (zip(strict=), etc.) that need behaviour review. Raise it in a
# dedicated PR, not a metadata edit.
target-version = "py39"
# Design docs hand-align the comments in their illustrative Python blocks; ruff
# formats code inside Markdown fences by default and collapses that alignment.
# The real .py files are still formatted -- only prose documents are exempt.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM115"]
# The existing scripts use a deliberate terse one-liner house style
# (`if x: return`, `a; b`). Keep the real-bug rules; don't fight the style.
ignore = ["E701", "E702"]
# SIM115 ("use a context manager for opening files") is gated so the class cannot grow back:
# CodeQL's quality pack used to catch it and no longer runs here (see .github/workflows/codeql.yml),
# which left nothing watching it at all. The 43 product sites that predate the gate carry a bare
# directive each -- one-shot reads whose handle CPython closes on the next refcount drop -- and the
# explanation lives here rather than 43 times in the tree. tests/ is exempt outright: those are
# throwaway fixture reads and the rule earns nothing there.

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["SIM115"]
# review_apply.py's single site stays out of the line-level baseline deliberately: line 95 carries a
# dismissed CodeQL py/path-injection alert (#27, false positive -- the stem is validated upstream by
# review_server._resolve), and editing that line makes CodeQL report the alert as *new* for the PR
# ("new alerts in code changed by this pull request"), which fails the CodeQL check. A directive on
# that line would cost more than it buys, so the file is exempt instead. The same trap applies to any
# line carrying a dismissed alert: prefer leaving such a line byte-identical to main.
"dubtitlerr/review/review_apply.py" = ["SIM115"]

[tool.ruff.format]
# `ruff format --check .` is a gate in CI and scripts/check.sh. This exclude list is a
# BASELINE, not policy: these files predate the gate and wait for a dedicated reformat PR
# (2013 changed lines -- a mechanical sweep that size would collide with every open branch).
# Shrink it, never grow it: format a file you are already editing and delete its line here.
# A new file must be formatted.
exclude = [
    "dubtitlerr/core/atomic_file.py",
    "dubtitlerr/core/common.py",
    "dubtitlerr/core/heartbeat.py",
    "dubtitlerr/core/notify.py",
    "dubtitlerr/core/unresolved.py",
    "dubtitlerr/glossary/glossary_acquire.py",
    "dubtitlerr/glossary/mine_glossary.py",
    "dubtitlerr/pipeline/boilerplate.py",
    "dubtitlerr/pipeline/dub_signs_merge.py",
    "dubtitlerr/pipeline/mux.py",
    "dubtitlerr/pipeline/reflow.py",
    "dubtitlerr/pipeline/repair.py",
    "dubtitlerr/review/review_apply.py",
    "dubtitlerr/review/review_auth.py",
    "dubtitlerr/review/review_requests.py",
    "dubtitlerr/review/review_status.py",
    "dubtitlerr/review/review_webhooks.py",
    "dubtitlerr/settings/settings_api.py",
    "dubtitlerr/settings/settings_notifications.py",
    "tests/test_acquire_cache.py",
    "tests/test_asr_bakeoff.py",
    "tests/test_boilerplate.py",
    "tests/test_decisions.py",
    "tests/test_dub_signs_merge.py",
    "tests/test_gate_fix_merge.py",
    "tests/test_generate.py",
    "tests/test_generate_only_re.py",
    "tests/test_gen_loop_requests.py",
    "tests/test_gen_loop_runtime_env.py",
    "tests/test_gen_loop_set_e.py",
    "tests/test_glossary_acquire.py",
    "tests/test_glossary_consequences.py",
    "tests/test_merge_pass.py",
    "tests/test_merge_pass_runtime_env.py",
    "tests/test_mine_glossary.py",
    "tests/test_mux.py",
    "tests/test_public_repo_hygiene.py",
    "tests/test_references_report.py",
    "tests/test_reftracks.py",
    "tests/test_render_readme_table.py",
    "tests/test_repair.py",
    "tests/test_repair_dub_vouched.py",
    "tests/test_repair_transport_retry.py",
    "tests/test_review_requests.py",
    "tests/test_review_settings.py",
    "tests/test_review_webhooks.py",
    "tests/test_settings_secret_leaks.py",
    "tests/test_wiki_scope.py",
    "tools/asr_bakeoff.py",
    "tools/bakeoff.py",
    "tools/glossary_score.py",
    "tools/references_report.py",
    "tools/timing_compare.py",
    "tools/vad.py",
]
